name: Deploy the API

# Manual, from main only. The site itself is GitHub Pages and publishes on
# push; this ships the backend in server/ to the EC2 instance.
#
# Shape:
#   1. build node_modules on an arm64 runner, tar server/, push to S3
#   2. tell the instance over SSM to pull that tarball and restart
#
# AWS sign-in is GitHub's OIDC token: no AWS keys are stored anywhere. The
# role ARN and bucket live in repo secrets rather than in this file because
# they contain the account id and this repository is public.
on:
  workflow_dispatch:

permissions:
  id-token: write        # required to request the OIDC token
  contents: read

concurrency: deploy-personal-page

env:
  AWS_REGION: us-west-2
  NODE_VERSION: "24"

jobs:
  deploy:
    # arm64 on purpose. The runtime is dominated by native binaries —
    # onnxruntime-node (92 MB), sharp, @napi-rs — and the target is a t4g
    # (Graviton) instance. Building on the default x86 runner installs x86
    # binaries that fail to load on the box, at require() time, long after
    # the deploy reports success. Free and GA for public repositories.
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Refuse to deploy anything but main
        if: github.ref_name != 'main'
        run: echo "::error::deploys run from main only" && exit 1

      # persist-credentials: false is no longer load-bearing, and is kept for
      # hygiene: nothing in this workflow installs over git any more.
      #
      # It used to matter, and the reason is worth keeping. By default
      # checkout writes http.https://github.com/.extraheader into the repo's
      # git config — an Authorization header for GITHUB_TOKEN — and that
      # header WINS over credentials supplied in a URL. So every git call in
      # the workspace authenticated as this repo's token, which could not
      # read the private llms repo, producing "Repository not found" no
      # matter which token was passed. It cost three runs to find, because
      # the header is only mentioned in checkout's post-job cleanup. Anyone
      # who reintroduces a git dependency will meet it again.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # The private libraries come from GitHub Packages now, not from git
      # tags, so there is nothing to rewrite: server/.npmrc points the
      # @williambrendel scope at the registry and expands NODE_AUTH_TOKEN,
      # and npm authenticates directly. The git URL rewriting this used to
      # need, and the script that did it, are gone with the git dependency —
      # `grep git+ssh server/package-lock.json` now finds nothing.
      #
      # STACK_PACKAGES_TOKEN is the stack-wide secret: one read:packages
      # token for every library rather than one per library. LLMS_READ_TOKEN
      # is kept as a fallback so this workflow runs before and after the
      # rename; drop it once the new secret exists. An unset secret
      # interpolates to an empty string, so `||` picks the one that is there.
      - name: Install
        working-directory: server
        env:
          NODE_AUTH_TOKEN: ${{ secrets.STACK_PACKAGES_TOKEN || secrets.LLMS_READ_TOKEN }}
        run: npm ci

      # `npm test` is the gate an unattended dependency update is judged on,
      # so a deploy runs exactly the same thing rather than a subset. It is
      # deterministic and makes no model calls: every stack-library import
      # resolves, the corpus vectors match their markdown, the fifteen golden
      # questions retrieve what they recorded, and all fourteen chips still
      # resolve to corpus sections.
      #
      # The corpus check matters most and is the reason this runs before the
      # tarball is built. Section ranges are byte offsets, so a stale pairing
      # does not error at runtime — it quietly returns misaligned text and
      # invites the model to fabricate across the gaps.
      - name: Test
        working-directory: server
        run: npm test

      # A stale ?v= stamp is invisible here and visible to every returning
      # visitor, who keeps the cached stylesheet because the URL never moved.
      # ship.sh gates on this too; CI is the backup path, so it gates as well.
      - name: Verify the cache stamps match their files
        working-directory: server
        run: npm run stamp -- --verify

      - name: Package
        id: package
        run: |
          set -euo pipefail
          # .env must never ship (the box reads its key from SSM) and
          # .model_cache travels separately — see scripts/push-models.sh.
          tar --exclude='.env' \
              --exclude='.model_cache' \
              --exclude='node_modules/.cache' \
              -czf "/tmp/${GITHUB_SHA}.tar.gz" -C . server
          echo "size=$(du -h "/tmp/${GITHUB_SHA}.tar.gz" | cut -f1)" >> "$GITHUB_OUTPUT"
          echo "key=releases/${GITHUB_SHA}.tar.gz" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload the release
        run: |
          aws s3 cp "/tmp/${GITHUB_SHA}.tar.gz" \
            "s3://${{ secrets.AWS_ARTIFACT_BUCKET }}/${{ steps.package.outputs.key }}"
          echo "uploaded ${{ steps.package.outputs.key }} (${{ steps.package.outputs.size }})"

      - name: Find the instance
        id: box
        run: |
          set -euo pipefail
          ID=$(aws ec2 describe-instances \
                 --filters "Name=tag:App,Values=personal-page" "Name=instance-state-name,Values=running" \
                 --query 'Reservations[].Instances[].InstanceId' --output text)
          if [ -z "$ID" ]; then
            echo "::error::no running instance tagged App=personal-page — launch it first (server/DEPLOY.md)"
            exit 1
          fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "instance $ID"

      # The release script runs on the box. It swaps a symlink rather than
      # writing over a live directory, so a failed extract cannot leave a
      # half-replaced install, and the previous release stays on disk for an
      # instant rollback.
      - name: Roll it out
        run: |
          set -euo pipefail
          CMD=$(aws ssm send-command \
            --instance-ids "${{ steps.box.outputs.id }}" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA::7}" \
            --parameters commands='[
              "set -euo pipefail",
              "SHA=${{ github.sha }}",
              "BUCKET=${{ secrets.AWS_ARTIFACT_BUCKET }}",
              "install -d -o app -g app /opt/personal-page/releases",
              "aws s3 cp s3://$BUCKET/releases/$SHA.tar.gz /tmp/$SHA.tar.gz",
              "rm -rf /opt/personal-page/releases/$SHA",
              "install -d -o app -g app /opt/personal-page/releases/$SHA",
              "tar -xzf /tmp/$SHA.tar.gz -C /opt/personal-page/releases/$SHA --strip-components=1",
              "ln -sfn /opt/personal-page/.model_cache /opt/personal-page/releases/$SHA/.model_cache",
              "chown -R app:app /opt/personal-page/releases/$SHA",
              "ln -sfn /opt/personal-page/releases/$SHA /opt/personal-page/current",
              "systemctl restart personal-page",
              "rm -f /tmp/$SHA.tar.gz",
              "cd /opt/personal-page/releases && ls -1dt */ | tail -n +3 | xargs -r rm -rf"
            ]' \
            --query 'Command.CommandId' --output text)

          echo "ssm command $CMD"
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD" \
                       --instance-id "${{ steps.box.outputs.id }}" \
                       --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Success) echo "rollout ok"; break ;;
              Failed|Cancelled|TimedOut)
                echo "::error::rollout $STATUS"
                aws ssm get-command-invocation --command-id "$CMD" \
                  --instance-id "${{ steps.box.outputs.id }}" \
                  --query 'StandardErrorContent' --output text
                exit 1 ;;
              *) sleep 5 ;;
            esac
          done

      # The rollout succeeding only means systemd accepted the restart. This
      # is the check that the service actually answers.
      - name: Confirm it is serving
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            BODY=$(curl -fsS --max-time 10 https://api.william-brendel.com/health || true)
            if echo "$BODY" | grep -q '"ok":true'; then
              echo "healthy: $BODY"
              exit 0
            fi
            sleep 5
          done
          echo "::error::/health did not report ok within 150s"
          exit 1
